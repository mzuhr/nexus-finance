<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS Finance</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18212f;--muted:#6b7280;--line:#e7eaf0;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:#111827;color:#fff;padding:22px 28px}header h1{margin:0}header p{margin:4px 0;color:#cbd5e1}main{max-width:1100px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.account{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.label{color:var(--muted);font-size:13px}.value{font-size:22px;font-weight:750;margin-top:5px}.accounts{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}section{margin:18px 0}.head{display:flex;justify-content:space-between;align-items:center}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:650;font-size:13px}input,select{width:100%;margin-top:6px;padding:11px;border:1px solid #d9dee8;border-radius:10px;font:inherit}.full{grid-column:1/-1}button{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{display:none;margin-top:10px;padding:10px;border-radius:10px}.ok{display:block;background:#ecfdf3;color:#166534}.err{display:block;background:#fef2f2;color:#991b1b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}@media(max-width:800px){.grid,.accounts{grid-template-columns:1fr 1fr}form{grid-template-columns:1fr}.full{grid-column:auto}}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<header><h1>NEXUS Finance</h1><p>Personal finance • Google Sheets backend</p></header><main>
<div class="grid"><div class="card"><div class="label">Total Saldo</div><div class="value">—</div></div><div class="card"><div class="label">Income Bulan Ini</div><div class="value">—</div></div><div class="card"><div class="label">Expense Bulan Ini</div><div class="value">—</div></div><div class="card"><div class="label">Cash Flow</div><div class="value">—</div></div></div>
<section><div class="head"><h2>Rekening</h2><button onclick="location.reload()">Refresh</button></div><div class="accounts"><div class="account"><div class="label">Mandiri</div><div class="value">—</div></div><div class="account"><div class="label">GoPay</div><div class="value">—</div></div><div class="account"><div class="label">Bank Jago</div><div class="value">—</div></div><div class="account"><div class="label">Blu</div><div class="value">—</div></div><div class="account"><div class="label">Cash</div><div class="value">—</div></div></div></section>
<section class="card"><h2>Tambah Transaksi</h2><form id="f">
<div><label>Jenis</label><select id="type"><option>Expense</option><option>Income</option><option>Transfer</option></select></div>
<div><label>Nominal</label><input id="amount" type="number" min="1" step="1" required placeholder="25000"></div>
<div id="cw"><label>Kategori</label><select id="cat"></select></div><div id="aw"><label>Rekening</label><select id="acc"></select></div>
<div id="fw" style="display:none"><label>Rekening Asal</label><select id="from"></select></div><div id="tw" style="display:none"><label>Rekening Tujuan</label><select id="to"></select></div>
<div class="full"><label>Deskripsi</label><input id="desc" placeholder="Contoh: Tiket KRL"></div><div class="full"><button id="save">Simpan Transaksi</button></div></form><div id="msg" class="msg"></div></section>
<section class="card"><h2>Transaksi Terakhir</h2><p style="color:#6b7280">Riwayat tetap dikelola oleh Dashboard Google Sheets untuk saat ini.</p></section>
</main><script>
const API='https://script.google.com/macros/s/AKfycbz-q2rvWVmg8Jcv1wKn9uly4COb7FZv9Ts5LOr5y_uQejlR8pwlWF-K4SrxRdRGzYnu/exec';
const TOKEN='PASTE_TOKEN_DI_SINI';
const A=['Mandiri','GoPay','Bank Jago','Blu','Cash'],E=['Makan','Jajan','Transportasi','Rumah & Tagihan','Belanja','Keluarga & Anak','Cicilan & Langganan','Personal & Lifestyle'],I=['Gaji','Remunerasi','Uang Makan','Bonus','Lainnya'];
const $=x=>document.getElementById(x), opts=a=>a.map(x=>`<option>${x}</option>`).join('');
$('acc').innerHTML=opts(A);$('from').innerHTML=opts(A);$('to').innerHTML=opts(A);
function ui(){let t=$('type').value,is=t==='Transfer';$('cat').innerHTML=opts(t==='Income'?I:E);$('cw').style.display=is?'none':'block';$('aw').style.display=is?'none':'block';$('fw').style.display=is?'block':'none';$('tw').style.display=is?'block':'none'}$('type').onchange=ui;ui();
function msg(s,ok){$('msg').textContent=s;$('msg').className='msg '+(ok?'ok':'err')}
$('f').onsubmit=async e=>{e.preventDefault();let b=$('save'),t=$('type').value,is=t==='Transfer',from=is?$('from').value:'',to=is?$('to').value:'';if(is&&from===to)return msg('Rekening asal dan tujuan harus berbeda.',false);b.disabled=true;msg('Mengirim…',true);let data={type:t,amount:Number($('amount').value),category:is?'':$('cat').value,account:is?from:$('acc').value,description:$('desc').value,fromAccount:from,toAccount:to,token:TOKEN};try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}),txt=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' — '+txt);try{let j=JSON.parse(txt);if(j.success===false)throw Error(j.message||'Backend menolak transaksi')}catch(x){if(x.message&&!x.message.startsWith('Unexpected'))throw x}msg('✅ Transaksi berhasil dikirim ke NEXUS.',true);$('f').reset();ui()}catch(x){msg('❌ Transaksi gagal: '+x.message,false)}finally{b.disabled=false}};
</script><script>if("serviceWorker"in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));}</script></body></html>
